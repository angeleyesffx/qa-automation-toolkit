name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Which tests to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - integration
      run_lint:
        description: 'Run flake8 linting'
        required: false
        default: false
        type: boolean
      generate_coverage:
        description: 'Generate coverage artifact'
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e . -r requirements-dev.txt

      - name: Run tests
        run: |
          SCOPE="${{ inputs.test_scope || 'all' }}"
          COV_FLAGS="--cov=src/qaforge --cov-report=xml --cov-report=term-missing"

          if [ "$SCOPE" = "unit" ]; then
            pytest tests/ --ignore=tests/test_database_mysql.py --ignore=tests/test_database_postgresql.py -v --tb=short $COV_FLAGS
          elif [ "$SCOPE" = "integration" ]; then
            pytest tests/test_database_mysql.py tests/test_database_postgresql.py -v --tb=short $COV_FLAGS
          else
            pytest tests/ -v --tb=short $COV_FLAGS
          fi

      - name: Upload to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage artifact
        if: github.event_name == 'workflow_dispatch' && inputs.generate_coverage == true && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_lint == true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8~=7.0

      - name: Run flake8
        run: flake8 src/qaforge tests/
